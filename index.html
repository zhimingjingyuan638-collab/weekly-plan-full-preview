                Googleドライブとの連携・カレンダー連携の認証情報は残るので、消去後に再ログインは不要です（Drive上の <code className="bg-white px-1 rounded">data.json</code> も次回ログイン直後の保存タイミングで空に上書きされます）。
              </div>
              <button onClick={onResetAll}
                className="px-5 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold transition shadow-sm">
                🗑 全データを消去（年度リセット）
              </button>
            </div>
          </section>
        </div>
      );
    }

    // ── WeeklyPlanView ─────────────────────────────────────────
    // v3：表示日数（5/6/7）を週ごとに切替。データは常に 7 日分（日曜含む）まで保持できる。
    function WeeklyPlanView({ settings, annualData, master, timetable, nikka, calendarConnected, onRequestCalendarConnect, setView, allData, setAllData }) {
      const [monday, setMonday] = useState(() => getMonday(new Date()));
      const [modal,  setModal ] = useState(null);
      const [reflectConfirm, setReflectConfirm] = useState(null);
      const [flashMsg, showFlash] = useFlash();
      const [syncing, setSyncing] = useState(false);
      const [syncResult, setSyncResult] = useState(null);

      const wk       = wkey(monday);
      // v3：表示日数（5=月〜金 / 6=月〜土 / 7=月〜日）。週ごとに localStorage に保存。
      const [visibleDays, setVisibleDays] = useState(() => loadVisibleDays(wkey(getMonday(new Date()))));
      // 週を切り替えたらその週の保存値を読み直す
      useEffect(() => { setVisibleDays(loadVisibleDays(wk)); }, [wk]);
      const cycleVisibleDays = () => {
        const nv = nextVisibleDays(visibleDays);
        setVisibleDays(nv);
        saveVisibleDays(wk, nv);
      };
      // 表示用にスライスした配列（データの読み書きは常に 7 日分の DAY_KEYS で行う）
      const VIS_DAY_KEYS = DAY_KEYS.slice(0, visibleDays);
      const VIS_DAYS     = DAYS.slice(0, visibleDays);

      const dates    = VIS_DAY_KEYS.map((_,i) => addDays(monday,i));   // 月〜表示最終日（描画用）
      const data     = allData[wk] || {};
      const classes  = settings.myClasses  || [];
      const subjects = settings.mySubjects || [];
      const term     = getCurrentTerm(monday, settings.terms);
      const ready    = isSettingsReady(settings);

      const patch = useCallback(updates => {
        setAllData(p => ({ ...p, [wk]:{ ...(p[wk]||{}), ...updates } }));
      }, [wk]);
      const getCell = (slotId, dayKey) => data.periods?.[slotId]?.[dayKey] || null;
      const setCell = useCallback((slotId, dayKey, cell) => {
        setAllData(p => {
          const wd = p[wk]||{};
          return { ...p, [wk]:{ ...wd, periods:{ ...(wd.periods||{}),
            [slotId]:{ ...(wd.periods?.[slotId]||{}), [dayKey]:cell } } } };
        });
      }, [wk]);

      const prevWk  = () => setMonday(m => addDays(m,-7));
      const nextWk  = () => setMonday(m => addDays(m,+7));
      const todayWk = () => setMonday(getMonday(new Date()));

      // この週だけにベース時間割を反映
      const reflectTermIdx = (() => {
        const t = settings.terms.findIndex(
          tm => tm.start && tm.end && wk >= tm.start && wk <= tm.end
        );
        return t >= 0 ? t : 0;
      })();
      const reflectTtPeriods =
        timetable?.[`term${reflectTermIdx+1}`]?.periods || {};
      const reflectHasBase = SLOTS.some(s =>
        DAY_KEYS.some(dk => reflectTtPeriods[s.id]?.[dk])
      );

      const openReflect = () => {
        if (!reflectHasBase) {
          showFlash(`「${settings.terms[reflectTermIdx]?.name||'1学期'}」のベース時間割が未入力です`);
          return;
        }
        const hasExisting = SLOTS.some(s =>
          DAY_KEYS.some(dk => {
            const c = data.periods?.[s.id]?.[dk];
            return c && (c.className || c.subject || c.unit || c.lessonNo);
          })
        );
        setReflectConfirm({ termIdx: reflectTermIdx, hasExisting });
      };

      const doReflect = (regMode) => {
        const ttPeriods = reflectTtPeriods;
        setAllData(p => {
          const wd = p[wk] || {};
          const existPeriods = wd.periods || {};
          const newPeriods = {};
          for (const slot of SLOTS) {
            newPeriods[slot.id] = { ...(existPeriods[slot.id]||{}) };
            // v3：表示中の曜日だけを反映対象にする（非表示の曜日のデータは触らない）
            for (const dayKey of VIS_DAY_KEYS) {
              const baseCell = ttPeriods[slot.id]?.[dayKey];
              const cur = newPeriods[slot.id][dayKey];
              const curFilled = cur && (cur.className || cur.subject || cur.unit || cur.lessonNo);
              if (regMode === 'empty' && curFilled) continue;
              newPeriods[slot.id][dayKey] = baseCell ? { ...baseCell } : (regMode==='overwrite' ? null : cur || null);
            }
          }
          return { ...p, [wk]: { ...wd, periods: newPeriods } };
        });
        setReflectConfirm(null);
        showFlash('この週にベース時間割を反映しました');
      };

      const patchEvent = (dayKey, v) => {
        const ev = { ...(data.events||{}) };
        if (!v) delete ev[dayKey]; else ev[dayKey]=v;
        patch({ events:ev });
      };
      const patchSchedule = (dayKey, v) => {
        const ds = { ...(data.dailySchedule||{}) };
        if (!v) delete ds[dayKey]; else ds[dayKey]=v;
        patch({ dailySchedule:ds });
      };

      // ── 📅 カレンダー同期：v2 では SLOTS 全体（特殊枠含む）を送る ──
      // v2.2：メモ・連絡事項（slot.id==='memo'）はカレンダー登録対象外。
      //       時刻欄を持たない終日メモなので、誤って毎日カレンダーに巨大イベントが作られるのを防ぐ。
      // v3：「表示中の曜日」だけを同期対象にする。非表示日のデータは消えないが、カレンダーには登録しない。
      const buildWeekPayload = () => {
        const lessons = [];
        for (const slot of SLOTS) {
          if (slot.id === 'memo') continue; // メモはカレンダー同期対象外
          for (let i=0;i<VIS_DAY_KEYS.length;i++) {
            const dayKey = VIS_DAY_KEYS[i];
            const c = data.periods?.[slot.id]?.[dayKey];
            if (!c) continue;
            const isSpecial = slot.type === 'special';
            // 特殊枠：メモが無ければ登録しない／通常：何も入っていなければ登録しない
            if (isSpecial) {
              if (!c.unit || !c.unit.trim()) continue;
            } else {
              if (!c.className && !c.subject && !c.unit && !c.lessonNo) continue;
            }
            const dateStr = toDateStr(dates[i]);
            const rec = getDayRecord(dateStr, annualData.dayRecords);
            const dailyStr = (data.dailySchedule?.[dayKey] || rec?.dailySchedule || '').trim();
            const autoTitle = isSpecial ? '' : getLessonTitle(master, c.subject, c.lessonNo);
            lessons.push({
              date: dateStr,
              slotId: slot.id,
              slotType: slot.type,
              slotLabel: slot.label,
              // 互換のため period も入れる（数値なら数値、特殊枠は文字列）
              period: slot.type==='class' ? Number(slot.id) : slot.id,
              className: c.className||'', subject: c.subject||'',
              lessonNo: c.lessonNo||'', unit: c.unit||'',
              lessonTitle: autoTitle||'',
              daily: dailyStr,
            });
          }
        }
        const events = [];
        for (let i=0;i<VIS_DAY_KEYS.length;i++) {
          const dayKey = VIS_DAY_KEYS[i];
          const dateStr = toDateStr(dates[i]);
          const rec = getDayRecord(dateStr, annualData.dayRecords);
          const evStr = (data.events?.[dayKey] || rec?.events || '').trim();
          if (evStr) events.push({ date: dateStr, text: evStr });
        }
        return {
          weekKey: wk,
          weekStart: toDateStr(dates[0]),
          weekEnd: toDateStr(dates[dates.length-1]),  // 表示最終日
          version: 3,
          lessons, events,
          nikka: nikka?.rows || [],
        };
      };

      // BYOC：Calendar API 直叩き同期。GAS不要。OAuthスコープ(calendar.events)を使い、
      // primary カレンダーに events.insert する。識別タグ #jukan-sync #wk=日付 で既存分を入替。
      const doSync = async () => {
        setSyncResult(null);
        if (!calendarConnected) {
          // カレンダー連携が未許可：同意フローを起動
          setSyncResult({ ok:false, msg:'まずカレンダー連携を有効化してください。「⚙️ 設定」タブの「📅 カレンダー連携を有効化」を押すと、Googleの同意画面が出ます。' });
          return;
        }
        const payload = buildWeekPayload();
        if (payload.lessons.length === 0 && payload.events.length === 0) {
          setSyncResult({ ok:false, msg:'この週には同期できる授業・行事・特殊枠メモがありません。' });
          return;
        }
        const noTime = payload.lessons.filter(L => !L.daily || !getNikkaTime(nikka, L.daily, L.slotId));
        if (payload.lessons.length > 0 && noTime.length === payload.lessons.length) {
          setSyncResult({ ok:false, msg:'この週の授業の時刻を引けませんでした。週案の「日課」欄に文字列が入っているか、「⏰ 日課マスター」タブにその日課コードと各枠の時刻が登録されているか確認してください。（行事だけ同期したい場合はこのまま続行できますが、授業は登録されません）' });
        }
        setSyncing(true);
        try {
          // 現在のトークンが calendar スコープを持っていなければ、追加要求（同意画面が出る）
          if (!hasCalendarScope()) {
            await requestAccessToken({ prompt: '', withCalendar: true });
            if (!hasCalendarScope()) {
              setSyncResult({ ok:false, msg:'カレンダー権限が付与されていません。「⚙️ 設定」タブの「📅 カレンダー連携を有効化」を押し、Google の同意画面で「カレンダーの予定の編集」を許可してください。' });
              setSyncing(false);
              return;
            }
          }
          const res = await calendarSyncWeek(payload, { nikka });
          setSyncResult({
            ok: true,
            msg: `Googleカレンダーに同期しました：授業・特殊枠 ${res.lessonsCreated} 件 / 行事 ${res.eventsCreated} 件${res.deleted > 0 ? `（古い同期分 ${res.deleted} 件を入れ替え）` : ''}`,
          });
        } catch (e) {
          const msg = (e && e.message) ? e.message : String(e);
          if (msg.indexOf('CALENDAR_SCOPE_MISSING') >= 0 || msg.indexOf('insufficient') >= 0) {
            setSyncResult({ ok:false, msg:'カレンダー権限が付与されていません。「⚙️ 設定」タブの「📅 カレンダー連携を有効化」を押し、Google の同意画面で「カレンダーの予定の編集」を許可してください。' });
          } else {
            setSyncResult({ ok:false, msg:`同期に失敗しました：${msg}` });
          }
        } finally {
          setSyncing(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 py-6 px-2 sm:px-4">
          <Flash msg={flashMsg}/>
          <div className="max-w-6xl mx-auto">
            {syncResult && (
              <div className={`mb-4 rounded-2xl px-5 py-3 flex items-start justify-between gap-4 no-print border
                ${syncResult.ok ? 'bg-sky-50 border-sky-200 text-sky-800' : 'bg-amber-50 border-amber-200 text-amber-800'}`}>
                <span className="text-sm font-medium leading-relaxed">
                  {syncResult.ok ? '✅ ' : '⚠️ '}{syncResult.msg}
                </span>
                <button onClick={()=>setSyncResult(null)}
                  className="shrink-0 text-xs px-3 py-1 rounded-lg font-bold bg-white/60 hover:bg-white transition">閉じる</button>
              </div>
            )}
            {!ready && (
              <div className="mb-4 bg-amber-50 border border-amber-200 rounded-2xl px-5 py-3 flex items-center justify-between no-print">
                <span className="text-amber-700 text-sm font-medium">⚠️ 初期設定が未完了です。担当クラス・教科を設定するとより使いやすくなります。</span>
                <button onClick={() => setView('settings')}
                  className="ml-4 shrink-0 px-4 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-bold transition">設定する →</button>
              </div>
            )}
            {/* v2.1.1：1テーブル構成に戻す（日程→行事→日課→1〜4限→昼食→5・6限→放課後→メモ）。
                放課後とメモ・連絡事項の間に太線（border-b-2）を維持する。 */}
            <div className="bg-white rounded-2xl shadow-lg overflow-hidden print-card">
              <div className="bg-gradient-to-r from-blue-700 to-blue-500 px-4 sm:px-6 py-4 sm:py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 no-print">
                <div>
                  {term && <span className="inline-block text-xs bg-white/20 text-blue-100 px-2.5 py-0.5 rounded-lg font-semibold mb-1">{term.name}</span>}
                  <h1 className="text-white text-lg sm:text-xl font-bold whitespace-nowrap">{fmd(dates[0])}（{DAYS[0]}）〜 {fmd(dates[dates.length-1])}（{VIS_DAYS[VIS_DAYS.length-1]}）</h1>
                </div>
                {/* スマホ：2段構成（ナビ／機能ボタン）。PC：1行 flex-wrap でこれまで通り。
                    スマホでボタンの中の漢字が縦書きに潰れていた原因＝flex-1 で6つ均等分割。
                    flex-1 を解除して whitespace-nowrap、機能側は overflow-x-auto で横スクロール可能に。 */}
                <div className="flex flex-col sm:flex-row gap-2 sm:items-center sm:flex-wrap">
                  {/* ナビ：前週／今週／次週 */}
                  <div className="flex gap-2 sm:contents">
                    <button onClick={prevWk}  className="flex-1 sm:flex-none whitespace-nowrap px-3 sm:px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl text-sm font-semibold transition">← 前週</button>
                    <button onClick={todayWk} className="flex-1 sm:flex-none whitespace-nowrap px-3 sm:px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl text-sm font-semibold transition">今週</button>
                    <button onClick={nextWk}  className="flex-1 sm:flex-none whitespace-nowrap px-3 sm:px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl text-sm font-semibold transition">次週 →</button>
                  </div>
                  {/* 機能：表示切替／時間割反映／カレンダー同期 ── スマホで折返さず横スクロール */}
                  <div className="flex gap-2 sm:contents overflow-x-auto -mx-1 px-1 sm:m-0 sm:p-0">
                    <button onClick={cycleVisibleDays} title="クリックで表示曜日数を切替（月〜金／月〜土／月〜日）。この週だけに保存されます。"
                      className="flex-none whitespace-nowrap px-3 sm:px-4 py-2 bg-white hover:bg-indigo-50 text-indigo-600 rounded-xl text-sm font-bold transition shadow-sm">
                      {visibleDaysLabel(visibleDays)}
                    </button>
                    <button onClick={openReflect} title="表示中の週だけにベース時間割を反映します"
                      className="flex-none whitespace-nowrap px-3 sm:px-4 py-2 bg-white hover:bg-blue-50 text-blue-600 rounded-xl text-sm font-bold transition shadow-sm">⤵ 時間割反映</button>
                    <button onClick={doSync} disabled={syncing} title="表示中の週をGoogleカレンダー（プライマリ）に登録します（要：⚙️設定タブで「📅 カレンダー連携を有効化」／日課マスター）"
                      className="flex-none whitespace-nowrap px-3 sm:px-4 py-2 bg-white hover:bg-sky-50 text-sky-600 rounded-xl text-sm font-bold transition shadow-sm disabled:opacity-60">
                      {syncing ? '⏳ 同期中…' : '📅 カレンダー同期'}
                    </button>
                    <button onClick={() => window.print()} className="hidden sm:block px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-sm font-semibold border border-white/30 transition">🖨 印刷</button>
                  </div>
                </div>
              </div>
              <div className="overflow-x-auto">
                {/* v3：表示日数（visibleDays）に応じて 5/6/7 列に切替。データは非表示日も保持される。 */}
                <table className="w-full border-collapse table-fixed" style={{minWidth: visibleDays===5 ? '600px' : visibleDays===6 ? '720px' : '820px'}}>
                  <colgroup>
                    <col style={{width:'56px'}}/>
                    {VIS_DAY_KEYS.map(k=><col key={k}/>)}
                  </colgroup>
                  <thead>
                    <tr className="border-b-2 border-gray-100">
                      <th className="p-2 text-xs text-gray-400 font-medium bg-gray-50">時限</th>
                      {dates.map((date,i) => {
                        const isSat = i === 5;
                        const isSun = i === 6;
                        const colBg = isToday(date) ? 'bg-blue-50' : isSun ? 'bg-rose-100/60' : isSat ? 'bg-gray-100/70' : 'bg-gray-50';
                        const textCol = isToday(date) ? 'text-blue-600' : isSun ? 'text-rose-700' : isSat ? 'text-indigo-700' : 'text-gray-700';
                        return (
                          <th key={i} className={`p-3 text-center border-l border-gray-100 ${colBg}`}>
                            <div className={`text-lg font-bold ${textCol}`}>{VIS_DAYS[i]}</div>
                            <div className={`text-xs mt-0.5 font-medium ${isToday(date)?'text-blue-400':'text-gray-400'}`}>{fmd(date)}</div>
                            {isToday(date) && <div className="mt-1.5 w-1.5 h-1.5 bg-blue-500 rounded-full mx-auto"/>}
                          </th>
                        );
                      })}
                    </tr>
                  </thead>
                  <tbody>
                    <tr className="border-b border-gray-100">
                      <td className="p-1 bg-amber-50 text-center text-xs font-bold text-amber-600 border-r border-gray-100">行事</td>
                      {VIS_DAY_KEYS.map((dayKey,i) => {
                        const rec = getDayRecord(toDateStr(dates[i]), annualData.dayRecords);
                        return (
                          <td key={dayKey} className="border-l border-gray-100 bg-amber-50/50">
                            <InlineEditor value={data.events?.[dayKey]||''} autoValue={rec?.events||''}
                              onChange={v=>patchEvent(dayKey,v)} placeholder="行事を入力" multiline className="text-amber-900"/>
                          </td>
                        );
                      })}
                    </tr>
                    <tr className="border-b-2 border-gray-200">
                      <td className="p-1 bg-blue-50 text-center text-xs font-bold text-blue-600 border-r border-gray-100">日課</td>
                      {VIS_DAY_KEYS.map((dayKey,i) => {
                        const rec = getDayRecord(toDateStr(dates[i]), annualData.dayRecords);
                        return (
                          <td key={dayKey} className={`border-l border-gray-100 ${isToday(dates[i])?'bg-blue-50/60':'bg-blue-50/25'}`}>
                            <InlineEditor value={data.dailySchedule?.[dayKey]||''} autoValue={rec?.dailySchedule||''}
                              onChange={v=>patchSchedule(dayKey,v)} placeholder="日課" className="text-blue-700 font-semibold"/>
                          </td>
                        );
                      })}
                    </tr>
                    {SLOTS.map((slot, idx) => {
                      const isSpecial = slot.type === 'special';
                      // v2.2：メモ行は授業表とは別物なので、メモの「1つ前」（=放課後）に太線を入れる。
                      //       これで「授業＋給食＋放課後」と「メモ」の視覚的な境界が維持される。
                      const memoIdx = SLOTS.findIndex(s => s.id === 'memo');
                      const isDividerRow = (memoIdx > 0) && (idx === memoIdx - 1);
                      const isMemoRow    = slot.id === 'memo';
                      return (
                        <tr key={slot.id} className={`${isDividerRow?'border-b-4 border-gray-500':'border-b border-gray-100'} ${isSpecial?(isMemoRow?'bg-gray-50':'bg-amber-50/30'):''}`}>
                          <td className={`p-1 text-center border-r border-gray-100 select-none ${isSpecial?(isMemoRow?'bg-gray-700 text-white':'bg-amber-100/60'):'bg-gray-50'}`}>
                            {isSpecial
                              ? <div className={`font-bold text-[11px] leading-tight ${isMemoRow?'text-white':'text-amber-700'}`}>{slot.icon}<br/>{slot.shortLabel||slot.label}</div>
                              : <>
                                  <div className="font-bold text-gray-600 text-sm leading-none">{slot.id}</div>
                                  <div className="text-gray-400 text-xs leading-none mt-0.5">限</div>
                                </>}
                          </td>
                          {VIS_DAY_KEYS.map((dayKey,i) => (
                            <td key={dayKey} className="border-l border-gray-100 p-0">
                              <PeriodCell slot={slot} cell={getCell(slot.id, dayKey)} today={isToday(dates[i])} master={master}
                                onClick={()=>setModal({slot, dayIdx:i, dayKey})}/>
                            </td>
                          ))}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
            <p className="text-center text-xs text-gray-400 mt-4 no-print">データは Google Drive に同期保存されます（同時にこのブラウザにもキャッシュ：weekPlanBYOC*）</p>
          </div>
          {modal && (
            <PeriodModal slot={modal.slot} dayIdx={modal.dayIdx}
              cell={getCell(modal.slot.id, modal.dayKey)} classes={classes} subjects={subjects} master={master}
              onSave={form=>{ setCell(modal.slot.id, modal.dayKey, form); setModal(null); }}
              onClear={()=>{ setCell(modal.slot.id, modal.dayKey, null); setModal(null); }}
              onClose={()=>setModal(null)}/>
          )}

          {/* ── この週だけ時間割反映 確認モーダル ── */}
          {reflectConfirm && (() => {
            const tName = settings.terms[reflectConfirm.termIdx]?.name || '1学期';
            return (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 no-print"
                onClick={e=>{ if(e.target===e.currentTarget) setReflectConfirm(null); }}>
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                  <div className="bg-gradient-to-r from-blue-700 to-blue-500 px-6 py-4 text-white flex items-center justify-between">
                    <h2 className="font-bold text-lg">⤵ この週に時間割を反映</h2>
                    <button onClick={() => setReflectConfirm(null)} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20">✕</button>
                  </div>
                  <div className="p-6 space-y-4">
                    <div className="bg-blue-50 rounded-xl p-4">
                      <p className="text-sm text-gray-700">
                        <span className="font-bold">{fmd(dates[0])}（{DAYS[0]}）〜 {fmd(dates[dates.length-1])}（{VIS_DAYS[VIS_DAYS.length-1]}）</span> の週に、
                        <span className="font-bold text-blue-700">「{tName}」のベース時間割</span>を反映します。
                      </p>
                      <p className="text-xs text-gray-500 mt-1.5">※ この週だけが対象です。他の週・一括登録には影響しません。表示中の全曜日・全枠（昼食・放課後・メモ含む）が対象です。</p>
                    </div>
                    {reflectConfirm.hasExisting ? (
                      <div>
                        <p className="text-sm font-bold text-gray-700 mb-3">この週には既に入力済みのコマがあります</p>
                        <div className="space-y-2">
                          <button onClick={() => doReflect('empty')}
                            className="w-full text-left px-4 py-3 rounded-xl border-2 border-gray-100 hover:border-blue-300 transition">
                            <p className="text-sm font-bold text-gray-700">空欄のみ埋める（安全）</p>
                            <p className="text-xs text-gray-400">入力済みのコマはそのまま残します</p>
                          </button>
                          <button onClick={() => doReflect('overwrite')}
                            className="w-full text-left px-4 py-3 rounded-xl border-2 border-red-100 hover:border-red-300 transition">
                            <p className="text-sm font-bold text-red-600">全て上書き</p>
                            <p className="text-xs text-gray-400">入力済みも含めてベース時間割で置き換えます</p>
                          </button>
                        </div>
                      </div>
                    ) : (
                      <button onClick={() => doReflect('overwrite')}
                        className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">
                        この週に反映する
                      </button>
                    )}
                    <button onClick={() => setReflectConfirm(null)}
                      className="w-full py-2.5 rounded-xl font-medium border-2 border-gray-200 text-gray-400 hover:bg-gray-50 transition">
                      キャンセル
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    // ── StatsView（授業時数集計） ──────────────────────────────
    // 集計対象：通常授業（type==='class'）のみ。特殊枠（昼食・放課後）は授業時数に含めない。
    function StatsView({ allData, settings }) {
      const [mode, setMode] = useState('class');
      const [detailClass, setDetailClass] = useState(null);

      const termStats = settings.terms.map((term) => {
        const weeks = getWeeksInTerm(term);
        const byClass = {}, bySubject = {}, byClassSubject = {};
        for (const wk of weeks) {
          const wd = allData[wk];
          if (!wd?.periods) continue;
          for (const slot of CLASS_SLOTS) {
            for (const dayKey of DAY_KEYS) {
              const cell = wd.periods[slot.id]?.[dayKey];
              if (!cell?.className && !cell?.subject) continue;
              const cls = cell.className || '';
              const sub = cell.subject  || '';
              if (cls) byClass[cls]   = (byClass[cls]   || 0) + 1;
              if (sub) bySubject[sub] = (bySubject[sub] || 0) + 1;
              if (cls && sub) {
                if (!byClassSubject[cls]) byClassSubject[cls] = {};
                byClassSubject[cls][sub] = (byClassSubject[cls][sub] || 0) + 1;
              }
            }
          }
        }
        return { byClass, bySubject, byClassSubject };
      });

      const foundClasses = [...new Set(termStats.flatMap(ts => Object.keys(ts.byClass)))];
      const displayClasses = settings.myClasses.length > 0
        ? settings.myClasses.filter(c => foundClasses.includes(c)).concat(foundClasses.filter(c => !settings.myClasses.includes(c)))
        : foundClasses;

      const foundSubjects = [...new Set(termStats.flatMap(ts => Object.keys(ts.bySubject)))];
      const displaySubjects = settings.mySubjects.length > 0
        ? settings.mySubjects.filter(s => foundSubjects.includes(s)).concat(foundSubjects.filter(s => !settings.mySubjects.includes(s)))
        : foundSubjects;

      const totalByClass   = {};
      const totalBySubject = {};
      termStats.forEach(ts => {
        Object.entries(ts.byClass).forEach(([k,v])   => { totalByClass[k]   = (totalByClass[k]   || 0) + v; });
        Object.entries(ts.bySubject).forEach(([k,v]) => { totalBySubject[k] = (totalBySubject[k] || 0) + v; });
      });

      const grandTotal = Object.values(totalByClass).reduce((s,v) => s+v, 0);

      const maxClass   = Math.max(1, ...Object.values(totalByClass));
      const maxSubject = Math.max(1, ...Object.values(totalBySubject));
      function cellBg(val, max) {
        if (!val) return '';
        const ratio = val / max;
        if (ratio >= 0.75) return 'bg-indigo-100 text-indigo-800 font-bold';
        if (ratio >= 0.40) return 'bg-indigo-50  text-indigo-700 font-semibold';
        return 'text-gray-700';
      }

      const hasData = displayClasses.length > 0 || displaySubjects.length > 0;
      const termTermStyle = ['text-blue-600','text-violet-600','text-teal-600'];
      const termBgStyle   = ['bg-blue-50',   'bg-violet-50',   'bg-teal-50'  ];

      const DetailModal = ({ cls }) => {
        const subs = settings.mySubjects.length > 0 ? settings.mySubjects : displaySubjects;
        return (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
            onClick={e => { if (e.target===e.currentTarget) setDetailClass(null); }}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
              <div className="bg-gradient-to-r from-indigo-700 to-indigo-500 px-6 py-4 flex items-center justify-between text-white">
                <div>
                  <p className="text-indigo-200 text-xs font-semibold">クラス詳細</p>
                  <h2 className="font-bold text-lg">{cls} の教科別授業時数</h2>
                </div>
                <button onClick={() => setDetailClass(null)} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 text-xl">✕</button>
              </div>
              <div className="overflow-x-auto p-4">
                <table className="w-full text-sm border-collapse">
                  <thead>
                    <tr className="border-b-2 border-gray-100">
                      <th className="text-left px-4 py-2 text-xs text-gray-400 font-semibold">教科</th>
                      {settings.terms.map((term,i) => (
                        <th key={i} className={`px-4 py-2 text-center text-xs font-bold ${termTermStyle[i]}`}>{term.name}</th>
                      ))}
                      <th className="px-4 py-2 text-center text-xs font-bold text-gray-700">合計</th>
                    </tr>
                  </thead>
                  <tbody>
                    {subs.map((sub, si) => {
                      const termVals = termStats.map(ts => ts.byClassSubject?.[cls]?.[sub] || 0);
                      const total = termVals.reduce((s,v) => s+v, 0);
                      if (!total) return null;
                      const st = SUB_STYLE[sub] || {};
                      return (
                        <tr key={sub} className={si%2===0?'bg-white':'bg-gray-50/50'}>
                          <td className="px-4 py-2.5">
                            <span className={`inline-block text-xs px-2 py-0.5 rounded font-semibold ${st.badge||'bg-gray-100 text-gray-600'}`}>{sub}</span>
                          </td>
                          {termVals.map((v, ti) => (
                            <td key={ti} className={`px-4 py-2.5 text-center tabular-nums ${v ? termTermStyle[ti] : 'text-gray-200'}`}>
                              {v || '—'}
                            </td>
                          ))}
                          <td className="px-4 py-2.5 text-center font-bold text-gray-800 tabular-nums">{total}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr className="border-t-2 border-gray-200">
                      <td className="px-4 py-2.5 font-bold text-gray-700 text-xs">合計</td>
                      {termStats.map((ts, ti) => (
                        <td key={ti} className={`px-4 py-2.5 text-center font-bold tabular-nums ${termTermStyle[ti]}`}>
                          {ts.byClass[cls] || '—'}
                        </td>
                      ))}
                      <td className="px-4 py-2.5 text-center font-black text-indigo-700 tabular-nums">
                        {totalByClass[cls] || '—'}
                      </td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="max-w-5xl mx-auto py-6 px-4 space-y-5">
          <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div className="bg-gradient-to-r from-indigo-700 to-indigo-500 px-6 py-4 text-white flex items-center justify-between">
              <div>
                <p className="text-indigo-200 text-xs font-semibold tracking-widest uppercase mb-0.5">Statistics</p>
                <h1 className="text-xl font-bold">授業時数集計</h1>
                <p className="text-indigo-200 text-[10px] mt-0.5">※ 昼食・放課後は集計対象外</p>
              </div>
              {hasData && (
                <div className="text-right">
                  <p className="text-indigo-200 text-xs">全学期 合計</p>
                  <p className="text-3xl font-black">{grandTotal}<span className="text-base font-normal ml-1 text-indigo-200">コマ</span></p>
                </div>
              )}
            </div>

            <div className="flex border-b border-gray-100">
              {[{key:'class',label:'クラス別',icon:'🏫'},{key:'subject',label:'教科別',icon:'📚'}].map(m => (
                <button key={m.key} onClick={() => { setMode(m.key); setDetailClass(null); }}
                  className={`flex-1 py-3 text-sm font-bold border-b-2 transition flex items-center justify-center gap-1.5
                    ${mode===m.key ? 'text-indigo-600 border-indigo-500' : 'text-gray-400 border-transparent hover:text-gray-600'}`}>
                  {m.icon} {m.label}
                </button>
              ))}
            </div>

            {!hasData ? (
              <div className="py-20 text-center text-gray-300">
                <div className="text-6xl mb-4">📊</div>
                <p className="font-semibold text-gray-400">週案にデータが入力されていません</p>
                <p className="text-xs mt-1 text-gray-300">週案タブでコマを登録すると、ここに集計が表示されます</p>
              </div>
            ) : mode === 'class' ? (
              <div className="overflow-x-auto">
                <table className="w-full text-sm border-collapse">
                  <thead>
                    <tr className="border-b-2 border-gray-100">
                      <th className="text-left px-5 py-3 text-xs text-gray-400 font-semibold bg-gray-50 w-28">クラス</th>
                      {settings.terms.map((term, i) => (
                        <th key={i} className={`px-4 py-3 text-center text-xs font-bold bg-gray-50 ${termTermStyle[i]}`}>
                          <div>{term.name}</div>
                          {term.start && <div className="text-gray-400 font-normal text-[10px] mt-0.5">{fmd(new Date(term.start+'T00:00:00'))}〜{fmd(new Date(term.end+'T00:00:00'))}</div>}
                        </th>
                      ))}
                      <th className="px-4 py-3 text-center text-xs font-bold text-gray-700 bg-gray-50">合計</th>
                    </tr>
                  </thead>
                  <tbody>
                    {displayClasses.map((cls, ci) => {
                      const termVals = termStats.map(ts => ts.byClass[cls] || 0);
                      const total = totalByClass[cls] || 0;
                      return (
                        <tr key={cls}
                          onClick={() => setDetailClass(cls)}
                          className={`border-b border-gray-50 cursor-pointer hover:bg-indigo-50/40 transition-colors ${ci%2===0?'bg-white':'bg-gray-50/40'}`}>
                          <td className="px-5 py-3">
                            <span className="font-bold text-gray-800 text-sm">{cls}</span>
                          </td>
                          {termVals.map((v, ti) => (
                            <td key={ti} className={`px-4 py-3 text-center tabular-nums text-sm rounded`}>
                              {v
                                ? <span className={`inline-block px-2.5 py-0.5 rounded-lg text-sm ${cellBg(v, maxClass)}`}>{v}</span>
                                : <span className="text-gray-200 text-xs">—</span>}
                            </td>
                          ))}
                          <td className="px-4 py-3 text-center">
                            <span className={`inline-block px-3 py-1 rounded-xl text-sm font-black ${total ? 'bg-indigo-100 text-indigo-700' : 'text-gray-200 text-xs'}`}>
                              {total || '—'}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr className="border-t-2 border-gray-200 bg-gray-50">
                      <td className="px-5 py-3 text-xs font-bold text-gray-500">合計</td>
                      {termStats.map((ts, ti) => {
                        const sum = Object.values(ts.byClass).reduce((s,v)=>s+v,0);
                        return (
                          <td key={ti} className={`px-4 py-3 text-center font-bold tabular-nums ${termTermStyle[ti]}`}>{sum||'—'}</td>
                        );
                      })}
                      <td className="px-4 py-3 text-center font-black text-indigo-700 text-base tabular-nums">{grandTotal}</td>
                    </tr>
                  </tfoot>
                </table>
                <p className="text-xs text-gray-400 text-center py-3">クリックすると教科別の詳細が見られます</p>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm border-collapse">
                  <thead>
                    <tr className="border-b-2 border-gray-100">
                      <th className="text-left px-5 py-3 text-xs text-gray-400 font-semibold bg-gray-50 w-28">教科</th>
                      {settings.terms.map((term, i) => (
                        <th key={i} className={`px-4 py-3 text-center text-xs font-bold bg-gray-50 ${termTermStyle[i]}`}>
                          <div>{term.name}</div>
                          {term.start && <div className="text-gray-400 font-normal text-[10px] mt-0.5">{fmd(new Date(term.start+'T00:00:00'))}〜{fmd(new Date(term.end+'T00:00:00'))}</div>}
                        </th>
                      ))}
                      <th className="px-4 py-3 text-center text-xs font-bold text-gray-700 bg-gray-50">合計</th>
                    </tr>
                  </thead>
                  <tbody>
                    {displaySubjects.map((sub, si) => {
                      const termVals = termStats.map(ts => ts.bySubject[sub] || 0);
                      const total = totalBySubject[sub] || 0;
                      const st = SUB_STYLE[sub] || {};
                      return (
                        <tr key={sub} className={`border-b border-gray-50 ${si%2===0?'bg-white':'bg-gray-50/40'}`}>
                          <td className="px-5 py-3">
                            <span className={`inline-block text-xs px-2.5 py-1 rounded-lg font-semibold ${st.badge||'bg-gray-100 text-gray-600'}`}>{sub}</span>
                          </td>
                          {termVals.map((v, ti) => (
                            <td key={ti} className="px-4 py-3 text-center tabular-nums text-sm">
                              {v
                                ? <span className={`inline-block px-2.5 py-0.5 rounded-lg text-sm ${cellBg(v, maxSubject)}`}>{v}</span>
                                : <span className="text-gray-200 text-xs">—</span>}
                            </td>
                          ))}
                          <td className="px-4 py-3 text-center">
                            <span className={`inline-block px-3 py-1 rounded-xl text-sm font-black ${total ? 'bg-indigo-100 text-indigo-700' : 'text-gray-200 text-xs'}`}>
                              {total || '—'}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr className="border-t-2 border-gray-200 bg-gray-50">
                      <td className="px-5 py-3 text-xs font-bold text-gray-500">合計</td>
                      {termStats.map((ts, ti) => {
                        const sum = Object.values(ts.bySubject).reduce((s,v)=>s+v,0);
                        return (
                          <td key={ti} className={`px-4 py-3 text-center font-bold tabular-nums ${termTermStyle[ti]}`}>{sum||'—'}</td>
                        );
                      })}
                      <td className="px-4 py-3 text-center font-black text-indigo-700 text-base tabular-nums">{grandTotal}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            )}
          </div>

          {mode === 'class' && hasData && (
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              {settings.terms.map((term, ti) => {
                const ts = termStats[ti];
                const sorted = Object.entries(ts.byClass).sort((a,b)=>b[1]-a[1]);
                const sum = sorted.reduce((s,[,v])=>s+v,0);
                if (!sorted.length) return null;
                const ts_style = TERM_STYLE[ti];
                return (
                  <div key={ti} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div className={`px-4 py-3 flex items-center gap-2 ${termBgStyle[ti]}`}>
                      <div className={`w-2 h-2 rounded-full ${ts_style.icon}`}/>
                      <span className={`text-sm font-bold ${termTermStyle[ti]}`}>{term.name}</span>
                      <span className={`ml-auto text-xs font-semibold ${termTermStyle[ti]}`}>{sum}コマ</span>
                    </div>
                    <div className="p-3 space-y-1.5">
                      {sorted.map(([cls, cnt]) => (
                        <div key={cls}
                          onClick={() => setDetailClass(cls)}
                          className="flex items-center gap-2 group cursor-pointer">
                          <span className="text-xs font-bold text-gray-700 w-12 shrink-0">{cls}</span>
                          <div className="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                            <div className={`h-2 rounded-full transition-all ${ts_style.icon}`}
                              style={{width:`${Math.round(cnt/sorted[0][1]*100)}%`}}/>
                          </div>
                          <span className="text-xs font-bold text-gray-600 tabular-nums w-8 text-right">{cnt}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {detailClass && <DetailModal cls={detailClass}/>}
        </div>
      );
    }

    // ── BYOC：Google OAuth + Drive + Calendar API 設定 ───────────
    // ★ユーザーは Google Cloud Console で OAuth Client ID を作成し、ここを置換する
    //   詳細は README_BYOC.md「ユーザー作業手順」参照
    const OAUTH_CLIENT_ID = '154524907596-p9ou78jjas9idjmdvbu3fgejgfmv5iga.apps.googleusercontent.com';
    // drive.file = 自アプリ作成ファイルのみ操作可（最小権限・Drive側）
    // calendar.events = 予定の読み書き（カレンダー連携を使う場合のみ追加で要求）
    const OAUTH_SCOPE_DRIVE    = 'https://www.googleapis.com/auth/drive.file';
    const OAUTH_SCOPE_CALENDAR = 'https://www.googleapis.com/auth/calendar.events';
    const DRIVE_FOLDER = '週案アプリ_データ';
    const DRIVE_FILE   = 'data.json';
    // カレンダー連携を有効化したかを記憶（localStorage に true/false 文字列で保存）
    const CALENDAR_ENABLED_KEY = 'weekPlanBYOCCalendarEnabled';
    // 同期イベントの識別タグ（GAS版と同じスキーマで二重登録を防ぐ）
    const SYNC_TAG_APP = '#jukan-sync';

    // アクセストークン状態。currentScope に応じて Drive のみ／+Calendar まで持つ。
    const tokenState = { accessToken:null, expiresAt:0, currentScope:'' };

    // ── トークン永続化（リロード対策）──────────────────────────
    // localStorage に保存。短命トークン（最大1時間）なので CSRF/盗難リスクは限定的だが、
    // ホストドメインを信用できる前提（GitHub Pages / Cloudflare Pages 想定）。
    const TOKEN_STORAGE_KEY = 'weekPlanBYOCAuthToken_v1';
    function loadStoredToken() {
      try {
        const raw = localStorage.getItem(TOKEN_STORAGE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !obj.accessToken || !obj.expiresAt) return null;
        // 60秒の余裕を見て期限内かチェック
        if (Date.now() > (obj.expiresAt - 60 * 1000)) return null;
        return obj;
      } catch { return null; }
    }
    function saveStoredToken() {
      try {
        if (!tokenState.accessToken || !tokenState.expiresAt) return;
        localStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify({
          accessToken: tokenState.accessToken,
          expiresAt:   tokenState.expiresAt,
          scope:       tokenState.currentScope,
        }));
      } catch {}
    }
    function clearStoredToken() {
      try { localStorage.removeItem(TOKEN_STORAGE_KEY); } catch {}
    }

    function isClientIdConfigured() {
      return OAUTH_CLIENT_ID && OAUTH_CLIENT_ID.indexOf('<') !== 0;
    }
    function hasCalendarScope() {
      return tokenState.currentScope && tokenState.currentScope.indexOf('calendar') >= 0;
    }

    // GIS（Google Identity Services）スクリプトが読み終わるまで待つ
    function waitForGIS(timeout = 8000) {
      return new Promise((resolve, reject) => {
        const t0 = Date.now();
        (function tick() {
          if (window.google && window.google.accounts && window.google.accounts.oauth2) return resolve();
          if (Date.now() - t0 > timeout) return reject(new Error('GIS load timeout'));
          setTimeout(tick, 100);
        })();
      });
    }

    // token client はスコープが変わると作り直す（GIS の仕様上、scope は init 時に固定）
    let _tokenClient = null;
    let _tokenClientScope = '';
    function getTokenClient(scope) {
      if (_tokenClient && _tokenClientScope === scope) return _tokenClient;
      _tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: OAUTH_CLIENT_ID,
        scope: scope,
        prompt: '',
        callback: () => {}, // 都度差し替える
      });
      _tokenClientScope = scope;
      return _tokenClient;
    }

    // アクセストークンを要求する。withCalendar=true なら calendar.events スコープも一緒に要求。
    function requestAccessToken({ prompt = '', withCalendar = false } = {}) {
      return new Promise((resolve, reject) => {
        if (!isClientIdConfigured()) return reject(new Error('OAUTH_CLIENT_ID 未設定。README_BYOC.md 参照'));
        const scope = withCalendar ? `${OAUTH_SCOPE_DRIVE} ${OAUTH_SCOPE_CALENDAR}` : OAUTH_SCOPE_DRIVE;
        try {
          const tc = getTokenClient(scope);
          tc.callback = (resp) => {
            if (resp && resp.access_token) {
              tokenState.accessToken  = resp.access_token;
              tokenState.expiresAt    = Date.now() + ((resp.expires_in || 3600) - 60) * 1000;
              tokenState.currentScope = resp.scope || scope;
              saveStoredToken(); // ★リロード対策：localStorage に保存
              resolve(resp.access_token);
            } else {
              reject(new Error('access_token 取得失敗'));
            }
          };
          tc.error_callback = (err) => reject(err || new Error('OAuth error'));
          tc.requestAccessToken({ prompt });
        } catch (e) { reject(e); }
      });
    }

    // 有効なトークンを返す（期限切れなら silent 再取得）。withCalendar 指定でCalendar要求。
    async function ensureToken({ withCalendar = false } = {}) {
      const needsCalendar = withCalendar;
      const hasCal = hasCalendarScope();
      const stillValid = tokenState.accessToken && Date.now() < tokenState.expiresAt;
      if (stillValid && (!needsCalendar || hasCal)) return tokenState.accessToken;
      return await requestAccessToken({ prompt: '', withCalendar: needsCalendar || hasCal });
    }

    // 401 を1回だけリカバリする fetch
    async function apiFetch(url, opts = {}, retry = true) {
      const token = await ensureToken();
      const headers = { ...(opts.headers || {}), Authorization: `Bearer ${token}` };
      const res = await fetch(url, { ...opts, headers });
      if (res.status === 401 && retry) {
        tokenState.accessToken = null;
        clearStoredToken();
        await requestAccessToken({ prompt: '', withCalendar: hasCalendarScope() });
        return apiFetch(url, opts, false);
      }
      return res;
    }
    // 互換エイリアス（Drive 系で使ってきた名前）
    const driveFetch = apiFetch;

    // ── ユーザー情報・Drive 基本操作 ─────────────────────────────
    async function fetchUserInfo() {
      try {
        const res = await driveFetch('https://www.googleapis.com/oauth2/v3/userinfo');
        if (!res.ok) return null;
        const j = await res.json();
        return { email: j.email, name: j.name || j.email };
      } catch { return null; }
    }

    async function ensureFolder() {
      const q = encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
      const list = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
      const j = await list.json();
      if (j.files && j.files.length > 0) return j.files[0].id;
      const create = await driveFetch('https://www.googleapis.com/drive/v3/files', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ name: DRIVE_FOLDER, mimeType: 'application/vnd.google-apps.folder' }),
      });
      const cj = await create.json();
      return cj.id;
    }
    async function findDataFile(folderId) {
      const q = encodeURIComponent(`name='${DRIVE_FILE}' and '${folderId}' in parents and trashed=false`);
      const list = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`);
      const j = await list.json();
      return (j.files && j.files[0]) ? j.files[0] : null;
    }
    async function downloadData(fileId) {
      const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
      if (!res.ok) throw new Error('download failed');
      return await res.json();
    }
    async function uploadData(folderId, fileId, payload) {
      const boundary = '-------jukan_byoc_' + Math.random().toString(36).slice(2);
      const metadata = fileId
        ? { name: DRIVE_FILE, mimeType: 'application/json' }
        : { name: DRIVE_FILE, mimeType: 'application/json', parents: [folderId] };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
        JSON.stringify(metadata) + `\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
        JSON.stringify(payload) + `\r\n--${boundary}--`;
      const url = fileId
        ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart&fields=id,modifiedTime`
        : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime`;
      const res = await driveFetch(url, {
        method: fileId ? 'PATCH' : 'POST',
        headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
        body,
      });
      if (!res.ok) throw new Error('upload failed: ' + res.status);
      return await res.json();
    }

    // ── Calendar API：週案ペイロードを primary カレンダーに書き込む ──────
    // 戦略：
    //  1) primary の events.list で `q=#jukan-sync #wk=<weekKey>` を検索し、古い同期分を削除
    //  2) lessons → 時刻ありなら timed event（dateTime 指定）、無ければスキップ
    //  3) events（行事）→ all-day event（date 指定）
    //  すべての description に `#jukan-sync #wk=<weekKey>` を含めて二重登録を防ぐ。
    async function calendarSyncWeek(payload, { nikka }) {
      if (!hasCalendarScope()) throw new Error('CALENDAR_SCOPE_MISSING');

      const wkTag = `#wk=${payload.weekKey}`;
      const q = `${SYNC_TAG_APP} ${wkTag}`;
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Tokyo';

      // 1) 既存の同期イベントを削除
      let deleted = 0;
      // primary カレンダーは時間範囲を絞り込まず q で広く拾う（最大 250 件想定）
      const listUrl = new URL('https://www.googleapis.com/calendar/v3/calendars/primary/events');
      listUrl.searchParams.set('q', q);
      listUrl.searchParams.set('maxResults', '250');
      listUrl.searchParams.set('singleEvents', 'true');
      // 古い同期残骸の取りこぼし対策で 過去90日〜未来180日 を timeMin/timeMax の目安に
      const tMin = new Date(payload.weekStart + 'T00:00:00');
      tMin.setDate(tMin.getDate() - 90);
      const tMax = new Date(payload.weekEnd + 'T00:00:00');
      tMax.setDate(tMax.getDate() + 180);
      listUrl.searchParams.set('timeMin', tMin.toISOString());
      listUrl.searchParams.set('timeMax', tMax.toISOString());
      try {
        const lr = await apiFetch(listUrl.toString());
        if (lr.ok) {
          const lj = await lr.json();
          const matches = (lj.items || []).filter(ev => {
            const d = ev.description || '';
            return d.indexOf(SYNC_TAG_APP) >= 0 && d.indexOf(wkTag) >= 0;
          });
          for (const ev of matches) {
            try {
              const dr = await apiFetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${ev.id}`, { method:'DELETE' });
              if (dr.ok || dr.status === 410) deleted++;
            } catch(_) {}
          }
        }
      } catch(_) {}

      // 2) lessons を作成（nikka は呼び出し元 state、payload.nikka はバックアップ。両方フォールバック）
      const nikkaObj = nikka || { rows: payload.nikka || [] };
      let lessonsCreated = 0;
      for (const L of payload.lessons) {
        const t = L.daily ? getNikkaTime(nikkaObj, L.daily, L.slotId) : null;
        if (!t) continue; // 時刻不明はスキップ（行事は別ループで作る）
        const isSpecial = L.slotType === 'special';
        const titleParts = [];
        if (isSpecial) {
          const icon = L.slotId==='lunch' ? '🍱' : L.slotId==='after' ? '🌙' : '';
          const head = (L.unit||'').slice(0,30);
          titleParts.push(`${icon} ${L.slotLabel || L.slotId}：${head}`);
        } else {
          if (L.className) titleParts.push(L.className);
          if (L.subject)   titleParts.push(L.subject);
          if (L.lessonNo)  titleParts.push(`第${L.lessonNo}時`);
          if (L.lessonTitle) titleParts.push(L.lessonTitle);
          else if (L.unit)   titleParts.push(L.unit.slice(0,30));
        }
        const summary = titleParts.filter(Boolean).join(' ') || '（無題）';
        const description = [
          L.unit || '',
          '',
          `${SYNC_TAG_APP} ${wkTag}`,
        ].join('\n').trim();
        const body = {
          summary,
          description,
          start: { dateTime: `${L.date}T${t.start}:00`, timeZone },
          end:   { dateTime: `${L.date}T${t.end}:00`,   timeZone },
        };
        try {
          const cr = await apiFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
            method:'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (cr.ok) lessonsCreated++;
        } catch(_) {}
      }

      // 3) 行事を all-day で作成
      let eventsCreated = 0;
      const addOneDay = (yyyy_mm_dd) => {
        const d = new Date(yyyy_mm_dd + 'T00:00:00');
        d.setDate(d.getDate()+1);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      };
      for (const E of payload.events) {
        const body = {
          summary: `📌 ${E.text.slice(0,80)}`,
          description: [E.text, '', `${SYNC_TAG_APP} ${wkTag}`].join('\n').trim(),
          start: { date: E.date },
          end:   { date: addOneDay(E.date) },
        };
        try {
          const cr = await apiFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
            method:'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (cr.ok) eventsCreated++;
        } catch(_) {}
      }
      return { lessonsCreated, eventsCreated, deleted };
    }

    // ── App ────────────────────────────────────────────────────
    // BYOC：起動時 Drive 取得→失敗時 localStorage キャッシュにフォールバック
    //       編集時は localStorage 同期保存＋500msデバウンスで Drive へ
    //       カレンダー連携は別スコープ（calendar.events）として「設定」タブで明示的に有効化する
    function App() {
      const [view,       setView      ] = useState('main');
      const [settings,   setSettings  ] = useState(() => {
        try { const s=localStorage.getItem('weekPlanBYOCSettings'); return s?{...DEFAULT_SETTINGS,...JSON.parse(s)}:DEFAULT_SETTINGS; }
        catch { return DEFAULT_SETTINGS; }
      });
      const [annualData, setAnnualData] = useState(() => {
        try { const s=localStorage.getItem('weekPlanBYOCAnnual'); return s?{...DEFAULT_ANNUAL,...JSON.parse(s)}:DEFAULT_ANNUAL; }
        catch { return DEFAULT_ANNUAL; }
      });
      const [timetable,  setTimetable ] = useState(() => {
        try { const s=localStorage.getItem('weekPlanBYOCTimetable'); return s?{...DEFAULT_TIMETABLE,...JSON.parse(s)}:DEFAULT_TIMETABLE; }
        catch { return DEFAULT_TIMETABLE; }
      });
      const [allData,    setAllData   ] = useState(() => {
        try {
          const raw = JSON.parse(localStorage.getItem('weekPlanBYOCData')||'{}');
          // メモ移行（旧 colSpan=7 メモ → 日別7セル）：BYOC は新規のため通常は空走するが、
          // v2 バックアップを取り込む場面に備えて残す。完了フラグで再実行を防ぐ。
          const migrated = localStorage.getItem('weekPlanBYOCMemoMigratedV22');
          if (raw && typeof raw === 'object' && !migrated) {
            const DAY_KEYS_LOCAL = ['mon','tue','wed','thu','fri','sat'];
            for (const wk of Object.keys(raw)) {
              const w = raw[wk];
              if (!w || typeof w !== 'object') continue;
              const hasOldMemos = w.memos && typeof w.memos === 'object' && Object.values(w.memos).some(v => v && String(v).trim());
              const hasOldMemo  = typeof w.memo === 'string' && w.memo.trim();
              if (!hasOldMemos && !hasOldMemo) continue;
              const periods = w.periods || {};
              const memoSlot = { ...(periods.memo || {}) };
              for (let i=0;i<DAY_KEYS_LOCAL.length;i++) {
                const dk = DAY_KEYS_LOCAL[i];
                if (memoSlot[dk] && memoSlot[dk].unit && String(memoSlot[dk].unit).trim()) continue;
                let text = '';
                if (w.memos && typeof w.memos[dk] === 'string') text = w.memos[dk];
                if (!text && i===0 && hasOldMemo) text = w.memo;
                if (text && text.trim()) {
                  memoSlot[dk] = { className:'', subject:'', lessonNo:'', unit:text };
                }
              }
              w.periods = { ...periods, memo: memoSlot };
              if (w.memos) delete w.memos;
              if (typeof w.memo === 'string') delete w.memo;
              raw[wk] = w;
            }
            try { localStorage.setItem('weekPlanBYOCMemoMigratedV22', '1'); } catch(_) {}
          }
          return raw;
        }
        catch { return {}; }
      });
      const [master,     setMaster    ] = useState(() => {
        try { const s=localStorage.getItem('weekPlanBYOCMaster'); return s?JSON.parse(s):DEFAULT_MASTER; }
        catch { return DEFAULT_MASTER; }
      });
      const [nikka,      setNikka     ] = useState(() => {
        try { const s=localStorage.getItem('weekPlanBYOCNikka'); return s?{...DEFAULT_NIKKA,...JSON.parse(s)}:DEFAULT_NIKKA; }
        catch { return DEFAULT_NIKKA; }
      });
      // カレンダー連携が「以前に有効化されたか」のローカルフラグ（実際の権限は token のスコープで再判定）
      const [calendarEnabled, setCalendarEnabled] = useState(() => {
        try { return localStorage.getItem(CALENDAR_ENABLED_KEY) === '1'; } catch { return false; }
      });
      const [calendarConnecting, setCalendarConnecting] = useState(false);
      const [calendarError,      setCalendarError     ] = useState('');

      // ── BYOC：認証・同期 state ─────────────────────────────
      const [authPhase,   setAuthPhase ] = useState('idle'); // 'idle' / 'signed-in'
      const [authError,   setAuthError ] = useState('');
      const [syncStatus,  setSyncStatus] = useState('loading'); // 'loading'/'synced'/'saving'/'offline'/'error'
      const [lastSyncAt,  setLastSyncAt] = useState(null); // Date: 最終同期成功時刻
      const [userInfo,    setUserInfo  ] = useState(null);
      const driveRef = useRef({ folderId:null, fileId:null, initialized:false });
      const loadedRef = useRef(false);          // 初回 Drive ロード完了フラグ
      const saveTimerRef = useRef(null);        // 500ms デバウンス用タイマー

      /* 「保存したのに消えるバグ」対策：localStorage 同期保存＋
       * ①書き込み直後に読み戻して検証 ②直近スナップショットを
       * 自動バックアップ（weekPlanBYOC*_backup）に二重保存しておく。 */
      const safeSave = useCallback((key, value) => {
        const json = JSON.stringify(value);
        try {
          localStorage.setItem(key, json);
          if (localStorage.getItem(key) !== json) throw new Error('verify failed');
          localStorage.setItem(key + '_backup', json);
        } catch (e) {
          try { console.warn('保存検証に失敗しました:', key, e); } catch(_) {}
          try { window.alert('データの保存に失敗した可能性があります。\n設定タブの「バックアップ」から書き出しをおすすめします。'); } catch(_) {}
        }
      }, []);

      useEffect(() => { safeSave('weekPlanBYOCSettings',  settings);  }, [settings]);
      useEffect(() => { safeSave('weekPlanBYOCAnnual',    annualData);}, [annualData]);
      useEffect(() => { safeSave('weekPlanBYOCTimetable', timetable); }, [timetable]);
      useEffect(() => { safeSave('weekPlanBYOCData',      allData);   }, [allData]);
      useEffect(() => { safeSave('weekPlanBYOCMaster',    master);    }, [master]);
      useEffect(() => { safeSave('weekPlanBYOCNikka',     nikka);     }, [nikka]);
      useEffect(() => {
        try { localStorage.setItem(CALENDAR_ENABLED_KEY, calendarEnabled?'1':'0'); } catch(_) {}
      }, [calendarEnabled]);

      // ── BYOC：Drive ロード ────────────────────────────────────
      // retryLeft：失敗時の自動リトライ回数（スマホ起動直後のネットワーク確立待ちを吸収）
      const loadFromDrive = useCallback(async (retryLeft = 2) => {
        setSyncStatus('loading');
        try {
          const folderId = await ensureFolder();
          const file = await findDataFile(folderId);
          driveRef.current.folderId = folderId;
          driveRef.current.fileId   = file ? file.id : null;
          driveRef.current.initialized = true;
          if (file) {
            const payload = await downloadData(file.id);
            if (payload && payload._app && payload._app.indexOf('jukan-integrated') === 0) {
              if (payload.settings)   setSettings({...DEFAULT_SETTINGS, ...payload.settings});
              if (payload.annualData) setAnnualData({...DEFAULT_ANNUAL, ...payload.annualData});
              if (payload.timetable)  setTimetable({...DEFAULT_TIMETABLE, ...payload.timetable});
              if (payload.allData)    setAllData(payload.allData);
              if (payload.master)     setMaster(payload.master);
              if (payload.nikka)      setNikka({...DEFAULT_NIKKA, ...payload.nikka});
              if (typeof payload.calendarEnabled === 'boolean') setCalendarEnabled(payload.calendarEnabled);
            }
          }
          loadedRef.current = true;
          setSyncStatus('synced');
          setLastSyncAt(new Date());
        } catch (e) {
          console.warn('Drive load failed:', e, 'retryLeft=', retryLeft);
          // 初回失敗時はスマホの通信確立待ちを想定して 2秒→4秒で再試行
          if (retryLeft > 0) {
            const delay = retryLeft === 2 ? 2000 : 4000;
            // loadedRef は false のまま → 再試行中に saveToDrive が走らない
            setTimeout(() => { loadFromDrive(retryLeft - 1); }, delay);
            return;
          }
          loadedRef.current = true;
          setSyncStatus('offline');
        }
      }, []);

      // ── BYOC：Drive 保存（500ms デバウンス） ──────────────────
      const saveToDrive = useCallback(() => {
        if (!loadedRef.current) return;
        if (authPhase !== 'signed-in') return;
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(async () => {
          setSyncStatus('saving');
          const payload = {
            _app:'jukan-integrated-byoc', _version:3,
            savedAt:new Date().toISOString(),
            settings, annualData, timetable, allData, master, nikka, calendarEnabled,
          };
          try {
            if (!driveRef.current.folderId) {
              driveRef.current.folderId = await ensureFolder();
            }
            const res = await uploadData(driveRef.current.folderId, driveRef.current.fileId, payload);
            if (res && res.id) driveRef.current.fileId = res.id;
            setSyncStatus('synced');
            setLastSyncAt(new Date());
          } catch (e) {
            console.warn('Drive save failed:', e);
            setSyncStatus('offline'); // localStorage には既に safeSave 済みなので退避OK
          }
        }, 500);
      }, [authPhase, settings, annualData, timetable, allData, master, nikka, calendarEnabled]);

      // どの state が変わっても Drive 同期キューに積む
      useEffect(() => { saveToDrive(); }, [settings, annualData, timetable, allData, master, nikka, calendarEnabled, saveToDrive]);

      // ── BYOC：ログイン（Drive scope のみで開始） ─────────────
      const doSignIn = useCallback(async () => {
        setAuthError('');
        try {
          if (!isClientIdConfigured()) {
            setAuthError('OAUTH_CLIENT_ID が未設定です。README_BYOC.md の手順に従って index.html 内の OAUTH_CLIENT_ID を置換してください。');
            return;
          }
          await waitForGIS();
          // 以前にカレンダーを有効化していたなら、最初から両方のスコープを要求して再同意を省く
          await requestAccessToken({ prompt: 'consent', withCalendar: calendarEnabled });
          const u = await fetchUserInfo();
          if (u) setUserInfo(u);
          setAuthPhase('signed-in');
          await loadFromDrive();
        } catch (e) {
          console.warn('Sign-in failed:', e);
          setAuthError('ログインに失敗しました：' + (e && e.message ? e.message : String(e)));
        }
      }, [loadFromDrive, calendarEnabled]);

      // ── BYOC：カレンダー連携を有効化 ────────────────────────
      const doConnectCalendar = useCallback(async () => {
        setCalendarError('');
        setCalendarConnecting(true);
        try {
          if (!isClientIdConfigured()) {
            setCalendarError('OAUTH_CLIENT_ID が未設定です。README_BYOC.md の手順に従って置換してください。');
            return;
          }
          // Drive＋Calendar スコープで再要求（同意画面が出る）
          await requestAccessToken({ prompt: 'consent', withCalendar: true });
          if (!hasCalendarScope()) {
            setCalendarError('「カレンダーの予定の編集」が許可されませんでした。再度お試しください。');
            return;
          }
          setCalendarEnabled(true);
        } catch (e) {
          setCalendarError('連携に失敗しました：' + (e && e.message ? e.message : String(e)));
        } finally {
          setCalendarConnecting(false);
        }
      }, []);

      // 連携解除（ローカルフラグのみ・実際のトークン取り消しは Google アカウント側で行う案内）
      const doDisconnectCalendar = useCallback(() => {
        if (!window.confirm('このアプリ内のカレンダー連携フラグをオフにします。\n（権限自体を取り消すには Google アカウントの「サードパーティの接続」から削除してください）')) return;
        setCalendarEnabled(false);
      }, []);

      // ── BYOC：ログアウト ────────────────────────────────────
      const doSignOut = useCallback(() => {
        if (!window.confirm('ログアウトしますか？\nブラウザのキャッシュデータ（weekPlanBYOC*）は残ります。')) return;
        try {
          if (tokenState.accessToken && window.google?.accounts?.oauth2) {
            google.accounts.oauth2.revoke(tokenState.accessToken, () => {});
          }
        } catch(_) {}
        tokenState.accessToken = null;
        tokenState.expiresAt   = 0;
        tokenState.currentScope = '';
        clearStoredToken(); // ★永続化トークンも消す
        loadedRef.current = false;
        driveRef.current = { folderId:null, fileId:null, initialized:false };
        setUserInfo(null);
        setAuthPhase('idle');
        setSyncStatus('loading');
      }, []);

      // ── BYOC：再読込ボタン ──────────────────────────────────
      const doReload = useCallback(async () => {
        if (authPhase !== 'signed-in') return;
        loadedRef.current = false;
        await loadFromDrive();
      }, [authPhase, loadFromDrive]);

      // ── ★自動サインイン（マウント時に一度だけ）─────────────
      //   localStorage に有効なトークンがあれば、Drive API でトークンの有効性を確認し
      //   即サインイン状態に復元する。silent サインイン（prompt:'none'）は使わない
      //   （iframe/popup を一瞬開いてしまうため、UX が悪化する）。
      //   トークンが無効・存在しない場合は idle のまま手動ログイン待ち。
      const autoSignedInRef = useRef(false);
      useEffect(() => {
        if (autoSignedInRef.current) return;
        autoSignedInRef.current = true;
        (async () => {
          if (!isClientIdConfigured()) return;
          const stored = loadStoredToken();
          if (!stored) return; // 手動ログイン待ち
          tokenState.accessToken  = stored.accessToken;
          tokenState.expiresAt    = stored.expiresAt;
          tokenState.currentScope = stored.scope || OAUTH_SCOPE_DRIVE;
          // Drive about API を叩いてトークンの有効性を検証
          //   drive.file スコープでも about?fields=user は許可されている
          try {
            const r = await fetch(
              'https://www.googleapis.com/drive/v3/about?fields=user',
              { headers: { Authorization: `Bearer ${stored.accessToken}` } }
            );
            if (!r.ok) throw new Error('stored token invalid: ' + r.status);
            const data = await r.json();
            if (data && data.user) {
              setUserInfo({
                email: data.user.emailAddress || '',
                name:  data.user.displayName || data.user.emailAddress || '',
              });
            }
            setAuthPhase('signed-in');
            await loadFromDrive();
          } catch (e) {
            console.info('Stored token invalid, cleared. Manual sign-in required.');
            tokenState.accessToken = null;
            tokenState.expiresAt = 0;
            tokenState.currentScope = '';
            clearStoredToken();
          }
        })();
      // 意図的に [] でマウント時1回のみ実行
      // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      // ── ★visibilitychange：戻ってきた時に Drive から最新化 ────
      useEffect(() => {
        function onVisibility() {
          if (document.visibilityState !== 'visible') return;
          if (authPhase !== 'signed-in') return;
          // 表示に戻った瞬間に最新を取りに行く（スマホとPCの切替時の同期に効く）
          loadFromDrive();
        }
        document.addEventListener('visibilitychange', onVisibility);
        return () => document.removeEventListener('visibilitychange', onVisibility);
      }, [authPhase, loadFromDrive]);

      // ── ★online：通信が復活した瞬間に自動再同期 ───────────────
      useEffect(() => {
        function onOnline() {
          if (authPhase !== 'signed-in') return;
          loadFromDrive();
        }
        window.addEventListener('online', onOnline);
        return () => window.removeEventListener('online', onOnline);
      }, [authPhase, loadFromDrive]);

      const syncProp = {
        status: syncStatus,
        userName: userInfo?.name || userInfo?.email || '',
        lastSyncAt,
        reload: doReload,
        signOut: doSignOut,
      };

      // バックアップ書き出し（BYOC形式）
      const exportBackup = () => {
        const payload = {
          _app:'jukan-integrated-byoc', _version:3,
          exportedAt:new Date().toISOString(),
          settings, annualData, timetable, allData, master, nikka, calendarEnabled,
        };
        const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        const d    = new Date();
        a.href = url;
        a.download = `週案BYOCバックアップ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };
      // バックアップ読み込み（BYOC / v2 / v1 すべて対応）
      const importBackup = (file) => {
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const p = JSON.parse(e.target.result);
            const validApps = ['jukan-integrated-byoc','jukan-integrated-v2','jukan-integrated'];
            if (!validApps.includes(p._app)) throw new Error('形式不一致');
            const isV1 = p._app === 'jukan-integrated';
            const isV2 = p._app === 'jukan-integrated-v2';
            const okMsg = isV1
              ? '旧バージョン（v1：jukan-integrated）のバックアップを BYOC 版に取り込みます。よろしいですか？\n（土曜・昼食・放課後・メモの枠は空欄で読み込まれます）'
              : isV2
              ? 'v2（jukan-integrated-v2）のバックアップを BYOC 版に取り込みます。よろしいですか？'
              : '現在のデータをバックアップの内容で置き換えます。よろしいですか？';
            if (!window.confirm(okMsg)) return;
            if (p.settings)   setSettings({...DEFAULT_SETTINGS, ...p.settings});
            if (p.annualData) setAnnualData({...DEFAULT_ANNUAL, ...p.annualData});
            if (p.timetable)  setTimetable({...DEFAULT_TIMETABLE, ...p.timetable});
            if (p.allData)    setAllData(p.allData);
            if (p.master)     setMaster(p.master);
            if (p.nikka)      setNikka({...DEFAULT_NIKKA, ...p.nikka});
            if (typeof p.calendarEnabled === 'boolean') setCalendarEnabled(p.calendarEnabled);
            window.alert(isV1 ? '旧バージョン（v1）のバックアップを BYOC 版に取り込みました。' :
                         isV2 ? 'v2 のバックアップを BYOC 版に取り込みました。' :
                                'バックアップを復元しました。');
          } catch (err) {
            window.alert('読み込みに失敗しました。正しいバックアップファイルを選んでください。');
          }
        };
        reader.readAsText(file);
      };

      // ── 全データ消去（年度リセット）──
      // 2段階確認＋localStorage の weekPlanBYOC* キーをすべて削除。
      // ただし「カレンダー連携を有効化したか」のフラグ（weekPlanBYOCCalendarEnabled）は残し、
      // 再ログイン後にカレンダー連携を再設定しなくていいようにする。
      // OAuthアクセストークン自体は元から in-memory（tokenState）なので localStorage には入っていない。
      const resetAllData = useCallback(() => {
        const ok1 = window.confirm('すべての週案・時間割・年間データを消去します。よろしいですか？\n※ 先にバックアップ書き出しをおすすめします');
        if (!ok1) return;
        const ok2 = window.confirm('本当に消去しますか？この操作は取り消せません');
        if (!ok2) return;
        try {
          const KEEP = new Set([CALENDAR_ENABLED_KEY]); // カレンダー有効化フラグだけは残す
          const keysToDelete = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf('weekPlanBYOC') === 0 && !KEEP.has(k)) keysToDelete.push(k);
          }
          for (const k of keysToDelete) localStorage.removeItem(k);
        } catch (e) {
          console.warn('localStorage 消去でエラー:', e);
        }
        // ページをリロードして初期状態へ（Drive へのデバウンス保存は次回ログイン直後に走り、Drive側のdata.jsonも空状態で上書きされる）
        window.alert('全データを消去しました。画面を再読み込みします。');
        try { window.location.reload(); } catch(_) {}
      }, []);

      // 未ログイン時はログインゲートのみ表示（編集UIは非表示）
      if (authPhase !== 'signed-in') {
        return <LoginGate onSignIn={doSignIn} error={authError} clientIdConfigured={isClientIdConfigured()} />;
      }

      return (
        // overflow-x-clip：scroll port を作らないので、子の overflow-x:auto の
        // タッチスクロールを阻害しない。未対応ブラウザでは無視される。
        <div className="min-h-screen bg-slate-100 flex flex-col w-full max-w-full" style={{overflowX:'clip'}}>
          <TopNav view={view} setView={setView} ready={isSettingsReady(settings)} sync={syncProp}/>
          {view==='main'
            ? <WeeklyPlanView settings={settings} annualData={annualData} master={master} timetable={timetable} nikka={nikka}
                calendarConnected={calendarEnabled}
                onRequestCalendarConnect={doConnectCalendar}
                setView={setView} allData={allData} setAllData={setAllData}/>
            : view==='timetable'
            ? <TimetableView timetable={timetable} setTimetable={setTimetable} settings={settings} master={master} allData={allData} setAllData={setAllData}/>
            : view==='master'
            ? <MasterView master={master} setMaster={setMaster}/>
            : view==='nikka'
            ? <NikkaView nikka={nikka} setNikka={setNikka}/>
            : view==='annual'
            ? <AnnualView annualData={annualData} setAnnualData={setAnnualData}/>
            : view==='stats'
            ? <StatsView allData={allData} settings={settings} master={master}/>
            : <SettingsView settings={settings}
                calendarConnected={calendarEnabled}
                calendarConnecting={calendarConnecting}
                calendarError={calendarError}
                onConnectCalendar={doConnectCalendar}
                onDisconnectCalendar={doDisconnectCalendar}
                onSave={setSettings}
                onExport={exportBackup} onImport={importBackup}
                onResetAll={resetAllData}/>
          }
        </div>
      );
    }

    // ── LoginGate（未ログイン時のフルスクリーン画面） ───────────
    function LoginGate({ onSignIn, error, clientIdConfigured }) {
      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 flex items-center justify-center p-6">
          <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
            <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-md mx-auto mb-4">
              <span className="text-white font-black text-2xl">週</span>
            </div>
            <h1 className="text-xl font-bold text-gray-800 mb-2">週案アプリ <span className="text-xs font-bold text-blue-500 bg-blue-50 px-1.5 py-0.5 rounded align-middle">BYOC</span></h1>
            <p className="text-sm text-gray-500 mb-6 leading-relaxed">
              データはあなた自身の Google Drive に保存されます。<br/>
              （フォルダ「{DRIVE_FOLDER}」が自動作成されます）
            </p>
            {clientIdConfigured ? (
              <button onClick={onSignIn}
                className="w-full px-6 py-3 bg-white hover:bg-gray-50 text-gray-700 rounded-xl text-sm font-semibold border-2 border-gray-200 transition flex items-center justify-center gap-3 shadow-sm">
                <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C33.6 6.1 29 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                  <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16.1 19 13 24 13c3 0 5.7 1.1 7.8 3l5.7-5.7C33.6 6.1 29 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
                  <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.1 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
                  <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2c-.4.4 6.6-4.8 6.6-14.7 0-1.3-.1-2.4-.4-3.5z"/>
                </svg>
                Google でログイン
              </button>
            ) : (
              <div className="text-left bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-800 leading-relaxed">
                <p className="font-bold mb-2">⚠️ セットアップが必要です</p>
                <p>このHTMLの上部にある <code className="bg-white px-1 rounded">OAUTH_CLIENT_ID</code> を、あなたが Google Cloud Console で取得した OAuth クライアントID に置換してください。</p>
                <p className="mt-2">詳しい手順は同梱の <code className="bg-white px-1 rounded">README_BYOC.md</code> をご覧ください。</p>
              </div>
            )}
            {error && <p className="text-xs text-red-600 mt-4">{error}</p>}
            <p className="text-[11px] text-gray-400 mt-6 leading-relaxed">
              要求する権限：<code className="bg-gray-100 px-1 rounded">drive.file</code>（このアプリが作成したファイルのみ操作可）<br/>
              カレンダー連携を有効化したときのみ：<code className="bg-gray-100 px-1 rounded">calendar.events</code> を追加で要求します。
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
